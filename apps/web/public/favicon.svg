<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Дайбилет">
  <!--
    Classic ticket after Flaticon ticket_1912 (Freepik): rounded rect,
    circular notches on short ends, dashed perforation. Rotated -45°,
    scaled so AABB fills ~88–90% of the frame (little padding for tab visibility).
    After rotate, translate(1.2 1.2) optically recenters: full short-axis corners
    point TL/BR and read as «влево-вверх» when only AABB-centered.
    Brand blue #4A7FD4 (DAIBILET_LOGO_BLUE / site.webmanifest theme_color).
    Attribution: Freepik / Flaticon https://www.flaticon.com/ru/free-icon/ticket_1912
  -->
  <g transform="translate(24 24) translate(1.2 1.2) rotate(-45) scale(0.88) translate(-24 -24)">
    <path
      fill="#4A7FD4"
      fill-rule="evenodd"
      d="M4.2 12.5h39.6a3.2 3.2 0 0 1 3.2 3.2v16.6a3.2 3.2 0 0 1-3.2 3.2H4.2a3.2 3.2 0 0 1-3.2-3.2V15.7a3.2 3.2 0 0 1 3.2-3.2zM0.8 24a4.4 4.4 0 1 0 8.8 0 4.4 4.4 0 1 0-8.8 0zM38.4 24a4.4 4.4 0 1 0 8.8 0 4.4 4.4 0 1 0-8.8 0zM31.4 13.8h2.7v2.6h-2.7zm0 3.9h2.7v2.6h-2.7zm0 3.9h2.7v2.6h-2.7zm0 3.9h2.7v2.6h-2.7zm0 3.9h2.7v2.6h-2.7z"
    />
