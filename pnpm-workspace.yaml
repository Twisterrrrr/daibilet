packages:
  - apps/*
  # Frozen Vite public app: source-only legacy, not a workspace package.
  - '!apps/public'
  - packages/*

engineStrict: true

allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

overrides:
  '@hono/node-server': 1.19.18
  browserslist: 4.29.6
  baseline-browser-mapping: 2.11.0
  fast-uri: 3.1.9
  hono: 4.13.19
  minimatch: 11.0.9
  mysql2: 3.24.6
  postcss-selector-parser: 6.1.5
  valibot: 1.5.0
  zod: 4.6.7

minimumReleaseAgeExclude:
  - browserslist@4.29.6
  - minimatch@11.0.9
  - update-browserslist-db@1.4.0
