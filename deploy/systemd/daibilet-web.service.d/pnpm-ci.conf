[Service]
# pnpm's deps status check refuses to reconcile node_modules without CI or a
# TTY. systemd gives neither, so daibilet-web crashed with
# ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY on 2026-10-01 whenever a deploy
# moved the checkout to a revision with changed dependencies, leaving the site
# on 502. Applied by hand on the server on 2026-10-01; committed here so the fix
# survives a host rebuild.
Environment=CI=true
Environment=confirmModulesPurge=false