# Drop-in: memory + V8 heap (host ~7.8Gi). Install:
#   mkdir -p /etc/systemd/system/daibilet-web.service.d
#   cp deploy/systemd/daibilet-web.service.d/memory.conf /etc/systemd/system/daibilet-web.service.d/
#   systemctl daemon-reload && systemctl restart daibilet-web
# Permanent recommendation MSK 8G: keep V8 heap bounded, but give the
# Next.js cgroup enough headroom so systemd does not push hot pages into swap.
[Service]
Environment=NODE_OPTIONS=--max-old-space-size=1280
MemoryAccounting=yes
MemoryHigh=2200M
MemoryMax=3G
OOMPolicy=continue
