# 8 GiB MSK host: the DTO rebuild needs more than 900 MiB resident memory.
# A low MemoryHigh previously caused ~1.8 GiB cgroup swap and sustained I/O
# despite several GiB of host MemAvailable. Keep a hard cap and small swap cap.
[Service]
MemoryAccounting=yes
MemoryHigh=3G
MemoryMax=3500M
MemorySwapMax=1G
