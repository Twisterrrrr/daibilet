# Drop-in: memory + V8 heap (3.8Gi→7.8Gi host). Install:
#   mkdir -p /etc/systemd/system/daibilet-api.service.d
#   cp deploy/systemd/daibilet-api.service.d/memory.conf /etc/systemd/system/daibilet-api.service.d/
#   systemctl daemon-reload && systemctl restart daibilet-api
#
# INC.504.26: MemorySwapMax — without it MemoryMax only caps RAM; process can thrash
# the whole host swap (seen: memory.peak~1.1G + swap.peak~3.8–4G → event-loop hang).
[Service]
Environment=NODE_OPTIONS=--max-old-space-size=1024
MemoryHigh=1200M
MemoryMax=1536M
MemorySwapMax=512M
OOMPolicy=continue
