# Drop-in: memory + V8 heap (3.8Gi host). Install:
#   mkdir -p /etc/systemd/system/daibilet-api.service.d
#   cp deploy/systemd/daibilet-api.service.d/memory.conf /etc/systemd/system/daibilet-api.service.d/
#   systemctl daemon-reload && systemctl restart daibilet-api
[Service]
Environment=NODE_OPTIONS=--max-old-space-size=1024
MemoryHigh=1200M
MemoryMax=1536M
