map $http_user_agent $daibilet_social_bot {
    default 0;
    ~*(bot|telegram|facebook|twitter|linkedin|slack|whatsapp|discord|vkshare|preview|embedly|pinterest|skype|googlebot|bingpreview|yandex|mail\.ru) 1;
}

upstream daibilet_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name daibilet.ru www.daibilet.ru api.daibilet.ru admin.daibilet.ru staging.daibilet.ru;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name daibilet.ru www.daibilet.ru *.daibilet.ru;

    ssl_certificate     /etc/ssl/daibilet.ru.crt;
    ssl_certificate_key /etc/ssl/daibilet.ru.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/daibilet/public;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location /api/ {
        proxy_pass http://daibilet_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @daibilet_social_preview {
        proxy_pass http://daibilet_api/api/public/social-preview?path=$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(venues|locations|events|blog|cities)/ {
        error_page 418 = @daibilet_social_preview;
        if ($daibilet_social_bot) {
            return 418;
        }
        try_files $uri $uri/ /index.html;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.daibilet.ru;

    ssl_certificate     /etc/letsencrypt/live/api.daibilet.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.daibilet.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /api/health {
        proxy_pass http://daibilet_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/public/ {
        proxy_pass http://daibilet_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/(admin|db|v1/(tc|tep)) {
        auth_basic "Daibilet admin";
        auth_basic_user_file /etc/nginx/.htpasswd-daibilet-admin;
        proxy_pass http://daibilet_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        return 404;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.daibilet.ru;

    ssl_certificate     /etc/letsencrypt/live/api.daibilet.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.daibilet.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    auth_basic "Daibilet admin";
    auth_basic_user_file /etc/nginx/.htpasswd-daibilet-admin;

    root /var/www/daibilet/admin;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    location /api/ {
        proxy_pass http://daibilet_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.daibilet.ru;

    ssl_certificate     /etc/letsencrypt/live/staging.daibilet.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.daibilet.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/daibilet/staging;
    index index.html;

    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location /api/ {
        proxy_pass http://daibilet_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
